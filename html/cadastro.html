<!DOCTYPE html>
<html>

<head>
    <title>Shima Culinaria Oriental</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="../img/logo_horizontal_fundo_transparente_para_TE.png" alt="logo shima">
        </a>
        <a href="index.html" class="container__botao">Voltar</a>
    </header>
    <section>
        <p class="subtitulo"><span>&bull;</span>PRIMEIRO ACESSO</p>
        <h1>Cadastre-se para fazer seu pedido.</h1>
        <h2>Preencha seus dados e endereço para calcularmos a entrega na hora e liberar o cardápio completo.</h2>
        <h3>Seus dados ficam salvos para os próximos pedidos e são armazenados com segurança.</h3>
    </section>
    <form>
        <div class="bloco__claro">
            <p>1º DADOS PESSOAIS</p>
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" required>
            <div class="cpf__telefone">
                <label for="telefone">Telefone *<input type="text" id="telefone" required></label>
                <label for="cpf">CPF *<input type="text" id="cpf" placeholder="000.000.000-00" required></label>
            </div>
            <label for="senha">Crie sua Senha *</label>
            <input type="password" id="senha" placeholder="Mínimo de 8 caracteres" required>
        </div>
        <div class="bloco__escuro">
            <p>2º ENDEREÇO DE ENTREGA</p>
            <div class="cep__es">
                <label for="cep">CEP *<input type="text" id="cep" required></label>
                <label for="es">Estado *<input type="text" id="es" required></label>
            </div>
            <div class="rua__num">
                <label for="rua">Rua/Avenida *<input type="text" id="rua" required></label>
                <label for="numero">Nº *<input type="text" id="numero" required></label>
            </div>
            <div class="bairro__cidade">
                <label for="bairro">Bairro *<input type="text" id="bairro" required></label>
                <label for="cidade">Cidade *<input type="text" id="cidade" required></label>
            </div>
            <label for="referencia">Ponto de referência *<input type="text" id="referencia" required></label>
        </div>
        <button type="submit" class="container__botao_cardapio">Criar conta<span>&rarr;</span></button>
    </form>
</body>

</html>
