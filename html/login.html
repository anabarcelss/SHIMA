<!DOCTYPE html>
<html>

<head>
    <title>Shima Culinaria Oriental</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <header>
        <a href="/">
            <img src="../img/logo_horizontal_fundo_transparente_para_TE.png" alt="logo shima">
        </a>
        <a href="index.html" class="container__botao">Voltar</a>
    </header>
    <section>
        <img src="../img/image_sushi_login.png" alt="sushi_login">
        <p class="subtitulo"><span>&bull;</span>BEM-VINDO DE VOLTA</p>
        <h1>Entre na sua conta.</h1>
        <h2>Acesse seu endereço salvo e vá direto para o cardápio montar o seu pedido.</h2>
    </section>
    <form class="login__form">
        <label for="telefone">WhatsApp *</label>
        <input type="text" id="telefone" placeholder="Digite seu telefone" required>
        <label for="senha">Senha *</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
        <div class="login__form__opcoes">
            <input type="checkbox" id="manter">
            <label for="manter">Manter conectado</label>
            <a href="#">Esqueci minha senha</a>
        </div>
        <button type="submit" class="container__botao_cardapio">Entrar e ir para o
            cardápio<span>&rarr;</span></button>
    </form>
    <div class="login__cadastro">
        <p>Primeira vez pedindo no Shima?</p>
        <a href="cadastro">Criar minha conta agora</a>
    </div>
    <footer>
        <div class="footer__login">
            <img src="../img/logo_horizontal_fundo_transparente_para_TE.png" alt="Logo Shima">
            <p>AMBIENTE SEGURO</p>
        </div>
    </footer>
</body>

</html>
